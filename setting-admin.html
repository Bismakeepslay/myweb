<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setting - Admin</title>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top left, #60A5FA 0%, transparent 35%),
    radial-gradient(circle at bottom right, #2563EB 0%, transparent 40%),
    linear-gradient(135deg, #1D4ED8, #3B82F6);
    display:flex;
    justify-content:center;
    align-items:center;
    padding: 40px;
}

/* MAIN CONTAINER */
.dashboard{
    width:1400px;
    min-height:850px;
    background:white;
    border-radius:50px;
    padding:60px;
    box-shadow: 0 25px 60px rgba(0,0,0,.15);
    overflow:hidden;
}

/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:50px;
}

.logo{
    background: linear-gradient(135deg, #60A5FA, #2563EB);
    color:white;
    padding:14px 30px;
    border-radius:999px;
    font-size:20px;
    font-weight:700;
}

.menu{
    display:flex;
    gap:12px;
}

.menu a{
    text-decoration:none;
    color:#64748B;
    padding:12px 18px;
    border-radius:999px;
    transition:.3s;
}

.menu a:hover{
    background:#EFF6FF;
    color:#2563EB;
}

.menu .active{
    background:#EFF6FF;
    color:#2563EB;
    font-weight:600;
}

.profile{
    background:#EFF6FF;
    color:#2563EB;
    padding:15px 20px;
    border-radius:999px;
    font-weight:600;
    position: relative;
    cursor: pointer;
}

.dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 100%;
    background: white;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    overflow: hidden;
    min-width: 150px;
    z-index: 100;
}

.dropdown a {
    display: block;
    padding: 20px;
    text-decoration: none;
    color: #2563EB;
}

.dropdown a:hover {
    background: #f0f0f0;
}

.profile:hover .dropdown {
    display: block;
}

/* HERO */
.hero{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:50px;
}

.hero-left{
    max-width:650px;
}

.hero-left h1{
    font-size:120px;
    line-height:1;
    color:#2563EB;
}

.hero-left p{
    color:#64748B;
    margin-top:15px;
    font-size:18px;
}

.hero-left button{
    margin-top:25px;
    border:none;
    background: linear-gradient(135deg, #60A5FA, #2563EB);
    color:white;
    padding:16px 28px;
    border-radius:999px;
    cursor:pointer;
    font-weight:600;
}

.hero-right{
    position:relative;
}

.blue-card{
    width:380px;
    height:300px;
    border-radius:70px;
    background: linear-gradient(135deg, #60A5FA, #2563EB);
    box-shadow: 0 20px 50px rgba(37,99,235,.35);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:100px;
}

.floating-card{
    position:absolute;
    bottom:-20px;
    right:-20px;
    background:white;
    border-radius:25px;
    padding:18px;
    width:220px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
}

.floating-card h4{
    color:#2563EB;
    margin-bottom:5px;
}

.floating-card p{
    color:#64748B;
    font-size:13px;
}

/* STATS */
.cards{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#F8FAFC;
    border-radius:30px;
    padding:25px;
}

.card-title{
    color:#64748B;
    margin-bottom:10px;
}

.card-value{
    color:#2563EB;
    font-size:38px;
    font-weight:700;
}

/* ACTIVITY */
.activity{
    margin-top:25px;
    background:#F8FAFC;
    border-radius:30px;
    padding:25px;
}

.activity h2{
    color:#0F172A;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    padding:15px;
    color:#64748B;
}

td{
    padding:15px;
    border-top:1px solid #E2E8F0;
}

.pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 15px;
}

.pagination button {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #4f46e5;
    color: white;
    font-weight: 600;
    transition: 0.2s ease;
}

.pagination button:hover {
    background: #3730a3;
    transform: translateY(-1px);
}

.pagination button:active {
    transform: scale(0.95);
}

#pageInfo {
    font-weight: 600;
    color: #333;
}

/* TABLET */
@media (max-width: 1200px){
    .dashboard{
        width:100%;
        min-height:auto;
        border-radius:35px;
    }
    .hero{
        flex-direction:column;
        text-align:center;
        gap:40px;
    }
    .hero-left{
        max-width:100%;
    }
    .hero-left h1{
        font-size:70px;
    }
    .cards{
        grid-template-columns:1fr;
    }
}

/* MOBILE */
@media (max-width: 600px) {

    body {
        padding: 16px;
        align-items: flex-start;
    }

    .dashboard {
        padding: 20px 16px 28px;
        border-radius: 30px;
        width: 100%;
        min-height: auto;
    }

    /* ── NAVBAR: 2-row via flex-wrap + order
    Baris 1: logo (kiri) + profile (kanan)
    Baris 2: menu melebar penuh              */
    .navbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
    }

    /* logo → baris 1 kiri */
    .logo {
        order: 1;
        font-size: 15px;
        padding: 10px 20px;
    }

    /* profile → baris 1 kanan */
    .profile {
        order: 2;
        margin-left: auto;
        font-size: 13px;
        padding: 10px 16px;
    }

    /* menu → baris 2, lebar penuh */
    .menu {
        order: 3;
        flex-basis: 100%;
        display: flex;
        gap: 6px;
    }

    .menu a {
        flex: 1;
        text-align: center;
        font-size: 12px;
        padding: 9px 6px;
        border-radius: 999px;
    }

    /* ── HERO ── */
    .hero {
        flex-direction: column;
        gap: 28px;
        margin-bottom: 28px;
        text-align: center;
    }

    .hero-left {
        max-width: 100%;
    }

    .hero-left h1 {
        font-size: 42px;
        line-height: 1.1;
    }

    .hero-left p {
        font-size: 14px;
        margin-top: 10px;
    }

    .hero-left button {
        margin-top: 18px;
        padding: 13px 24px;
        font-size: 14px;
    }

    /* hero right: card penuh lebar, floating card dalam */
    .hero-right {
        width: 100%;
        display: flex;
        justify-content: center;
        padding-bottom: 30px;   /* ruang buat floating-card */
    }

    .blue-card {
        width: 100%;
        max-width: 340px;
        height: 200px;
        border-radius: 40px;
        font-size: 60px;
    }

    .floating-card {
        bottom: -10px;
        right: calc(50% - 150px + 5px); /* sejajarkan ke kanan blue-card */
        width: 170px;
        padding: 12px 14px;
        border-radius: 18px;
    }

    .floating-card h4 {
        font-size: 13px;
    }

    .floating-card p {
        font-size: 11px;
    }

    /* ── CARDS ── */
    .cards {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .card {
        padding: 18px 20px;
        border-radius: 20px;
    }

    .card button {
        border: none;
        background: linear-gradient(135deg, #60A5FA, #2563EB);
        color:white;
        padding: 13px 20px;
        border-radius: 999px;
        cursor:pointer;
        font-weight:600;
    }

    .card-value {
        font-size: 28px;
    }

    /* ── ACTIVITY TABLE ── */
    .activity {
        border-radius: 20px;
        padding: 18px 16px;
        overflow-x: auto;
    }

    table {
        min-width: 460px;
    }

    th, td {
        padding: 12px 10px;
        font-size: 13px;
    }

    /* ── PAGINATION ── */
    .pagination {
        gap: 8px;
        margin-top: 14px;
    }

    .pagination button {
        padding: 7px 14px;
        font-size: 13px;
        border-radius: 8px;
    }
}
</style>
</head>
<body>

<div class="dashboard">

    <div class="navbar">

        <div class="logo">OMG</div>

        <div class="menu">
            <a href="dashboard-admin.html">Home</a>
            <a href="users-admin.html">Users</a>
            <a href="apps-admin.html">Apps</a>
            <a href="setting-admin.html" class="active">Setting</a>
        </div>

        <div class="profile" id="profileDropdown">
            <span id="usernameText">username</span>
            <div class="dropdown">
                <a href="profile-admin.html" id="btnProfile">Profile</a>
                <a href="#" id="btnLogout">Log out</a>
            </div>
        </div>

    </div>

    <div class="hero">
        <div class="hero-left">
            <h1>On My Game</h1>
            <p>Setting page</p>
            <button>Upload new post</button>
        </div>

        <div class="hero-right">
            <div class="blue-card">
                <b>OMG</b>
            </div>
            <div class="floating-card">
                <h4>Name Post</h4>
                <p>Capt Post</p>
            </div>
        </div>
    </div>

    <div class="cards">
        <div class="card">
            <div class="card-title">Logos</div>
            <button>Upload here</button>
        </div>
        <div class="card">
            <div class="card-title">Division</div>
            <button onclick="window.location.href='division-admin.html'">
                Set Division Role
            </button>
        </div>
        <div class="card">
            <div class="card-title">Key Setting</div>
            <div class="card-value"><button>Set key logo</button></div>
        </div>
    </div>

    <div class="activity">
        <h2>Logo updated</h2>
        <table>
            <thead>
                <tr>
                    <th>Preview</th>
                    <th>Name</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="activityBody"></tbody>
        </table>

        <div class="pagination">
            <button id="prevBtn">Prev</button>
            <span id="pageInfo"></span>
            <button id="nextBtn">Next</button>
        </div>
    </div>

</div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
    'https://bbvwxsxntblwukjpfcqf.supabase.co',
    'sb_publishable_Mx6l4Z3hDALxTeW6nIOYfA_xfWA-tVR'
)

// ini buat logout ya
document.addEventListener('DOMContentLoaded', () => {
    const username = localStorage.getItem('username')
    if (!username) { window.location.href = 'sign-in.html'; return }

    const usernameEl = document.getElementById('usernameText')
    if (usernameEl) usernameEl.innerText = username

    const logoutBtn = document.getElementById('btnLogout')
    if (!logoutBtn) return

    logoutBtn.addEventListener('click', async (e) => {
        e.preventDefault()
        const userId = localStorage.getItem('user_id')
        const username = localStorage.getItem('username')
        if (!userId) { window.location.href = 'sign-in.html'; return }

        const { error } = await supabase
            .from('logs')
            .insert([{ id_users: userId, activity: 'Logout account' }])

        if (error) console.log('Logout log error:', error)

        localStorage.removeItem('user_id')
        localStorage.removeItem('username')
        window.location.href = 'sign-in.html'
    })
})
</script>

</body>
</html>
